# Core game defaults used by clients when no CLI override is provided.
game:
  board_size: 9

# AI runtime, model, search, self-play, and training defaults.
ai:
  runtime:
    # auto selects CUDA when torch can see a GPU, otherwise CPU.
    device: "auto"
    model_path: "models/latest.pth"

  model:
    architecture: "alphanet"
    version: "alphanet-v2"
    board_size: 9
    in_channels: 3
    num_filters: 96
    num_res_blocks: 6
    value_hidden_dim: 128

  mcts:
    num_simulations: 64
    c_puct: 1.5
    dirichlet_alpha: 0.3
    dirichlet_epsilon: 0.25
    add_root_noise: true

  # Arena samples moves from MCTS visit distributions. Set move_temperature to
  # 0 for deterministic best-visit evaluation.
  arena:
    games: 40
    move_temperature: 1.0
    seed: 0
    seed_base: 9000
    minimum_score: 0.5

  self_play:
    output_path: "data/selfplay.pt"
    games: 100
    batch_size: 1
    workers: 1
    temperature: 1.0
    temperature_drop_move: 20
    seed:

  train:
    dataset_path: "data/selfplay.pt"
    output_path: "models/latest.pth"
    epochs: 10
    batch_size: 128
    lr: 0.001
    weight_decay: 0.0001
